server:
  port: 8083

spring:
  application:
    name: payment-service

  # Local-dev convenience: secrets from the git-ignored .env (see user-service for details).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/payment_db
    username: ${PAYMENT_DB_USERNAME:payment_svc}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: payment-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 11: Kafka producer (same settings as account-service; see its application.yml).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

  # Phase 10: payment-service as an OAuth2 CLIENT with its own identity (Client Credentials).
  security:
    oauth2:
      client:
        registration:
          account-service:                         # registration ID, used in AccountClientConfig
            provider: keycloak
            client-id: payment-service
            client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET}   # from .env locally, a Secret in Kubernetes
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            # Only the token endpoint: no OIDC discovery at startup, so the service starts even
            # while Keycloak is down (the first internal call then fails cleanly with 503).
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/banking/protocol/openid-connect/token}

banking:
  kafka:
    topics:
      payment-events: banking.payment-events
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

  # Phase 9: outgoing service-to-service calls.
  clients:
    account-service:
      # Direct to the service, NOT through the public gateway (no second rate limit, no CORS, one hop less).
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
      connect-timeout: 1s
      # Timeout budget: a transfer makes up to 4 sequential calls (2 reads, debit, credit/refund),
      # plus at most one token request to Keycloak (cached for ~5 min).
      # 4 × 2 s = 8 s must stay below the gateway's response timeout for /api/payments (10 s),
      # otherwise the client sees 504 while the transfer is still running.
      read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
