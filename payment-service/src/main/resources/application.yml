server:
  port: 8083

spring:
  application:
    name: payment-service

  # Local-dev convenience: secrets from the git-ignored .env (see user-service for details).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/payment_db
    username: ${PAYMENT_DB_USERNAME:payment_svc}
    password: ${PAYMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: payment-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 11: Kafka producer (same settings as account-service; see its application.yml).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

  # Phase 10: payment-service as an OAuth2 CLIENT with its own identity (Client Credentials).
  security:
    oauth2:
      client:
        registration:
          account-service:                         # registration ID, used in AccountClientConfig
            provider: keycloak
            client-id: payment-service
            client-secret: ${PAYMENT_SERVICE_CLIENT_SECRET}   # from .env locally, a Secret in Kubernetes
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            # Only the token endpoint: no OIDC discovery at startup, so the service starts even
            # while Keycloak is down (the first internal call then fails cleanly with 503).
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/banking/protocol/openid-connect/token}

banking:
  kafka:
    topics:
      payment-events: banking.payment-events
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

  # Phase 9: outgoing service-to-service calls.
  clients:
    account-service:
      # Direct to the service, NOT through the public gateway (no second rate limit, no CORS, one hop less).
      base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
      connect-timeout: 1s
      # Timeout budget (Phase 12, with retries), worst case for one transfer:
      #   2 reads × (2 attempts × 2 s + 0.1 s)          8.2 s
      #   debit 2 s + credit 2 s (no retry on timeout)   4.0 s
      #   refund 2 s + backoff of fast failures ~1.4 s   3.4 s   → ≈ 15.6 s
      # Must stay below the gateway's response timeout for /api/payments (20 s), otherwise the
      # client sees 504 while the transfer is still running. An OPEN breaker cuts this to milliseconds.
      read-timeout: 2s

# Phase 12: resilience policy for calls to account-service (see AccountServiceResilience).
resilience4j:
  circuitbreaker:
    instances:
      accountService:
        # Judge account-service by its last 10 calls, once there are at least 5.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50            # ≥ 50 % failures → OPEN
        slow-call-duration-threshold: 1500ms  # a call slower than this counts as "slow"...
        slow-call-rate-threshold: 80          # ...and ≥ 80 % slow calls also → OPEN (degraded, not dead)
        wait-duration-in-open-state: 10s      # fail fast for 10 s, then let a few probes through
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # Only "no usable answer" is a failure. A business "no" (404/422) is a HEALTHY service.
        record-exceptions:
          - com.banking.paymentservice.client.AccountServiceUnavailableException
        ignore-exceptions:
          - com.banking.paymentservice.client.AccountRejectedException
          - io.github.resilience4j.bulkhead.BulkheadFullException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
        register-health-indicator: true
        # An OPEN breaker means ACCOUNT-service is unhealthy, not this service. If it turned
        # /actuator/health DOWN, Kubernetes would restart payment-service for someone else's outage.
        allow-health-indicator-to-fail: false
  retry:
    instances:
      # Which exceptions are retried: RetryPolicies (code). How often and how long to wait: here.
      accountServiceRead:
        max-attempts: 2                       # 1 try + 1 retry
        wait-duration: 100ms
      accountServiceWrite:
        max-attempts: 2                       # only for "certainly not executed"
        wait-duration: 200ms
      accountServiceCompensation:
        max-attempts: 4                       # a refund must try hard: 200 ms, 400 ms, 800 ms
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  bulkhead:
    instances:
      accountService:
        # At most 25 requests may wait on account-service at once. Without this, a slow
        # account-service would tie up ALL of payment-service's request threads.
        max-concurrent-calls: 25
        max-wait-duration: 50ms
  ratelimiter:
    instances:
      accountService:
        # Don't let payment-service flood account-service (≈ 25 transfers/s at 4 calls each).
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0                   # over the limit → fail immediately, don't queue

management:
  endpoints:
    web:
      exposure:
        # health/info are public; the resilience endpoints require an ADMIN token (SecurityConfig).
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads,ratelimiters,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  health:
    circuitbreakers:
      enabled: true
