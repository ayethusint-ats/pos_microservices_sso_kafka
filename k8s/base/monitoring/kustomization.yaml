apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: banking-platform
      banking.dev/layer: platform
resources:
  - prometheus.yaml
  - jaeger.yaml
  - network-policies.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: banking-monitoring
    files:
      - prometheus.yml
  - name: prometheus-rules
    namespace: banking-monitoring
    files:
      - ../../../infrastructure/monitoring/prometheus/alerts.yml   # the Phase 14 rules, unchanged
