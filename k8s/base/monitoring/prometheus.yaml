# Prometheus needs to LIST pods to discover them: its own ServiceAccount, and a Role (not a
# ClusterRole) that allows exactly get/list/watch on pods in the banking namespace. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: banking-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: banking
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: banking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: banking-monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: banking-monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: banking-monitoring
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus      # its token IS needed: it calls the Kubernetes API
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534                  # "nobody" in the prom/prometheus image
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - { name: http, containerPort: 9090 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: rules, mountPath: /etc/prometheus/rules }
            # Local dev: metrics are kept in an emptyDir (lost with the pod). Production: a PVC, or
            # remote-write to long-term storage (Thanos, Mimir) and the Prometheus Operator.
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: { sizeLimit: 1Gi }
