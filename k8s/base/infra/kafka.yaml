# Kafka: one KRaft broker (its own controller), as in Compose. Production: 3+ brokers, RF 3,
# min.insync.replicas 2, usually an operator (Strimzi) or a managed service.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: banking-infra
  labels: { app.kubernetes.io/name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: banking-infra
  labels: { app.kubernetes.io/name: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka }
    spec:
      automountServiceAccountToken: false
      # IMPORTANT for Kafka: by default Kubernetes injects KAFKA_PORT=tcp://10.96.x.x:9092 (and more)
      # for the Service named "kafka". The image turns every KAFKA_* variable into a broker setting,
      # and the broker fails on the bogus "port" property. Service discovery is DNS anyway.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # "appuser" in apache/kafka
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          ports:
            - { name: kafka, containerPort: 9092 }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://localhost:9093" }
            # What clients reconnect to after bootstrapping: the Service's DNS name, valid in every namespace.
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.banking-infra.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            # The default 1 GiB heap would not fit the limit below. The page cache does the heavy lifting.
            - { name: KAFKA_HEAP_OPTS, value: "-Xms384m -Xmx384m" }
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 768Mi }
          startupProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            # Not read-only: the image's start script writes the broker config from the env variables.
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
# Topics as code: the same idempotent script as Compose's kafka-init, as a Job. Until Kafka is up
# it fails and Kubernetes retries it (backoffLimit); then it completes and stays "Complete".
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: banking-infra
  labels: { app.kubernetes.io/name: kafka-topics }
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-topics }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: create-topics
          image: apache/kafka:4.1.1
          command: [/bin/bash, /scripts/create-topics.sh]
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:9092" }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: kafka-topics }
