# Postgres: one server, one database + role per service (same init scripts as Compose).
# A StatefulSet, not a Deployment: a stable identity (postgres-0) and its OWN PersistentVolumeClaim,
# which survives pod restarts and rescheduling. Production: a managed database with backups, HA, PITR.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banking-infra
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: banking-infra
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false    # never talks to the Kubernetes API
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60      # let Postgres finish a clean shutdown checkpoint
      securityContext:
        # The alpine image's postgres user. Running as it from the start (instead of root + gosu)
        # is what makes the pod acceptable to the "restricted" Pod Security profile.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.12-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            # A sub-directory: the volume's root may hold files (lost+found) that initdb refuses.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_DB, value: postgres }
            # max_connections stays at the default 100: the pools are sized to fit it (apps/java-config.env).
          envFrom:
            # POSTGRES_USER/PASSWORD + the per-service passwords the init scripts read.
            # Created by k8s/scripts/create-secrets.sh from .env; never in git.
            - secretRef: { name: postgres-init }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          # Ready = accepts TCP connections. During first-time init Postgres runs on a unix socket only,
          # so the pod is NOT ready (and gets no traffic) until the databases and roles exist.
          startupProbe:
            exec: { command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres'] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres'] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d postgres'] }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }    # unix socket + lock file
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
