apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: banking-platform
      banking.dev/layer: app
resources:
  - user-service.yaml
  - account-service.yaml
  - payment-service.yaml
  - transaction-service.yaml
  - notification-service.yaml
  - api-gateway.yaml
  - frontend.yaml
  - autoscaling.yaml
  - network-policies.yaml
configMapGenerator:
  - name: banking-java-config
    namespace: banking
    envs:
      - java-config.env
