# How traffic gets in locally: NodePort Services on fixed ports, which kind maps to localhost.
# Only these five are reachable from your machine; the services stay ClusterIP (cluster-internal).
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: banking }
spec:
  type: NodePort
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30080 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: banking }
spec:
  type: NodePort
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30420 }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: banking-infra }
spec:
  type: NodePort
  ports:
    - { name: http, port: 8180, targetPort: http, nodePort: 30180 }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: banking-monitoring }
spec:
  type: NodePort
  ports:
    - { name: http, port: 9090, targetPort: http, nodePort: 30090 }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: banking-monitoring }
spec:
  type: NodePort
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui, nodePort: 30686 }
