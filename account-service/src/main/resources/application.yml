server:
  port: 8082

spring:
  application:
    name: account-service

  # Phase 2: in-memory H2 in PostgreSQL compatibility mode. Phase 3 switches to PostgreSQL.
  datasource:
    url: jdbc:h2:mem:account_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop   # Phase 2 only. Phase 3: Flyway migrations + validate.
    open-in-view: false

  h2:
    console:
      enabled: true   # http://localhost:8082/h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
