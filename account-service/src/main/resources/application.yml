server:
  port: 8082

spring:
  application:
    name: account-service

  # Local-dev convenience: secrets from the git-ignored .env (see user-service for details).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/account_db
    username: ${ACCOUNT_DB_USERNAME:account_svc}
    password: ${ACCOUNT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: account-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
