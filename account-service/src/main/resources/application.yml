server:
  port: 8082

spring:
  application:
    name: account-service

  # Local-dev convenience: secrets from the git-ignored .env (see user-service for details).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/account_db
    username: ${ACCOUNT_DB_USERNAME:account_svc}
    password: ${ACCOUNT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: account-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

# Phase 5: this service is an OAuth2 Resource Server and trusts tokens from the Keycloak "banking" realm.
banking:
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Anyone (probes) sees {"status":"UP"}; component details only for ROLE_ADMIN tokens.
      show-details: when-authorized
      roles: ADMIN
