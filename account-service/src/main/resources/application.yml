server:
  port: 8082

spring:
  application:
    name: account-service

  # Local-dev convenience: secrets from the git-ignored .env (see user-service for details).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      # Phase 15, in containers: each secret is a FILE /run/secrets/<NAME> (Compose secrets, Kubernetes
      # Secrets). configtree turns the file name into a property, so ${<NAME>} below resolves from it.
      - optional:configtree:/run/secrets/

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/account_db
    username: ${ACCOUNT_DB_USERNAME:account_svc}
    password: ${ACCOUNT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: account-service-pool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Phase 11: Kafka producer. Values are JSON strings serialized with the app's own ObjectMapper.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                    # leader AND in-sync replicas must have it before "sent"
      properties:
        enable.idempotence: true   # broker drops duplicates caused by producer retries
        # Fail fast instead of blocking a request thread for the default 60 s when Kafka is down.
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Phase 5: this service is an OAuth2 Resource Server and trusts tokens from the Keycloak "banking" realm.
banking:
  kafka:
    topics:
      account-transactions: banking.account-transactions
  # Phase 13: Transactional Outbox relay (OutboxRelay).
  outbox:
    poll-interval-ms: 500     # how often unpublished rows are sent: the extra latency of an event
    batch-size: 100
    send-timeout: 5s          # wait this long for Kafka's ack before leaving the row for the next run
    retention: 7d             # published rows are deleted after this
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Anyone (probes) sees {"status":"UP"}; component details only for ROLE_ADMIN tokens.
      show-details: when-authorized
      roles: ADMIN

---
# Phase 14: observability. Metrics → Prometheus (/actuator/prometheus), traces → OpenTelemetry
# (OTLP) → Jaeger, and every log line carries the trace ID.
spring:
  kafka:
    template:
      observation-enabled: true    # a span per sent record, and the W3C traceparent header on it
    listener:
      observation-enabled: true    # the consumer continues the producer's trace
management:
  observations:
    enable:
      # Found live: Spring Security adds ~6 spans per request per service (filter chain, authentication,
      # authorization), about 60 % of a transfer's trace, hiding the calls that matter. Off for traces
      # AND their metrics; authentication failures still show up as 401s in http.server.requests.
      spring.security: false
  metrics:
    tags:
      application: ${spring.application.name}   # one label to tell the services apart in Prometheus
    distribution:
      percentiles-histogram:
        http.server.requests: true   # histogram buckets, so Prometheus can compute p95/p99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 100 % locally; e.g. 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

---
# JSON log lines (Elastic Common Schema) for log collectors: SPRING_PROFILES_ACTIVE=json-logs.
# Without the profile, logs stay human-readable (with [traceId-spanId] after the level).
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs

---
# Phase 15: running in containers.
management:
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness: Docker healthcheck now, Kubernetes probes in Phase 16
server:
  shutdown: graceful             # on SIGTERM (docker stop): stop accepting, finish in-flight requests
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s   # then stop anyway; below Compose's stop_grace_period (30 s)

---
# Phase 16: on Kubernetes. Spring Boot detects it (every pod gets KUBERNETES_SERVICE_HOST) and
# activates this document by itself: no profile to remember, and nothing changes outside Kubernetes.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
management:
  server:
    # Actuator (metrics, health details) moves to its own port. A NetworkPolicy filters PORTS, not
    # URL paths: now it can let Prometheus reach 9000 and nothing else, and callers reach only the API port.
    port: 9000
  endpoint:
    health:
      probes:
        # /livez and /readyz ALSO on the main port: Kubernetes should probe the port that serves
        # traffic (a healthy management port says nothing about a stuck API connector).
        add-additional-paths: true
