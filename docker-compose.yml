# Local infrastructure for the Banking Platform.
# It grows one phase at a time: Postgres (Phase 3), Keycloak (Phase 4), Kafka (Phase 11), and so on.
#
#   docker compose up -d        start
#   docker compose ps           status and health
#   docker compose down         stop (data is kept in the named volume)
#   docker compose down -v      stop AND delete data (re-runs the init scripts next time)
#
# Values like ${POSTGRES_ADMIN_PASSWORD} come from the .env file next to this file.
# ${VAR:?message} makes Compose refuse to start if the variable is missing.

name: banking-platform

# Phase 15: common settings of the six Spring Boot containers (YAML anchors, used below).
x-java-service: &java-service
  build: &java-build
    context: .
    dockerfile: Dockerfile
  profiles: [app]                       # `docker compose --profile app up` starts the application too
  restart: unless-stopped
  mem_limit: 512m                       # the JVM sizes its heap from this (MaxRAMPercentage=75)
  stop_grace_period: 30s                # > Spring's 20 s graceful shutdown phase
  labels:
    banking.logs: "true"                # Alloy ships logs of containers with this label to Loki
  networks: [default]

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: json-logs     # JSON log lines (ECS) for Loki
  DB_HOST: postgres                     # Compose service names = DNS names on the network
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092  # the INTERNAL listener (Phase 11)
  # Issuer = what is IN the token. The browser gets tokens from localhost:8180, and Keycloak's fixed
  # KC_HOSTNAME makes tokens fetched from inside the network carry the same issuer. Keys and tokens
  # are FETCHED over the internal network (localhost inside a container is the container itself).
  KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/banking
  KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/banking/protocol/openid-connect/certs
  OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

x-depends-on-data: &depends-on-data
  postgres:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully   # topics exist before any producer/consumer starts

services:
  postgres:
    image: postgres:17.12-alpine          # pin an exact version so every machine runs the same one
    container_name: banking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by infrastructure/postgres/init/01-create-service-databases.sh
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?set TRANSACTION_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      # host:container. The host port is 5433 by default so it doesn't clash with a locally
      # installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity Provider: login, tokens, users, roles. Our services never see a password.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: banking-keycloak
    # start-dev: HTTP allowed, theme caching off. For learning only; production uses `start`
    # with TLS and an optimized build.
    # --import-realm: imports every *.json in /opt/keycloak/data/import at startup,
    # but SKIPS a realm that already exists (so edits to the JSON need a re-import, see docs).
    command: ["start-dev", "--import-realm"]
    environment:
      # One-time admin for the master realm (admin console).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Keycloak stores its data in its own Postgres database (not the dev H2 file).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db   # "postgres" = Compose service name (Docker DNS)
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # Same port inside and outside the container keeps URLs identical everywhere.
      KC_HTTP_PORT: 8180
      # Fixed public URL: tokens always carry iss=http://localhost:8180/realms/banking,
      # no matter which network address a request came in on.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"         # /health/ready on the management port 9000
      # Read by ${...} placeholders in the realm JSON, so no secret is stored in git.
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?set PAYMENT_SERVICE_CLIENT_SECRET in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
    ports:
      - "8180:8180"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy   # wait for the DB healthcheck, not just container start
    healthcheck:
      # The image has no curl, so use bash's built-in /dev/tcp to call the readiness endpoint.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Event streaming (Phase 11). Single broker in KRaft mode: the broker is its own controller,
  # no ZooKeeper. Two listeners because clients connect from two "places":
  #   localhost:9092   services started on your machine (mvn spring-boot:run)
  #   kafka:29092      containers on the Compose network (kafka-init now, all services in Phase 15)
  # A client connects to the bootstrap address, then reconnects to the ADVERTISED address the broker
  # returns, so each listener must advertise an address that works from where its clients are.
  kafka:
    image: apache/kafka:4.1.1
    container_name: banking-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker → internal topics can't have 3 replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by infrastructure/kafka/create-topics.sh.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image's default is /tmp/kraft-combined-logs, which is NOT the volume below:
      # topics and messages would vanish whenever the container is re-created.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: creates the topics, then exits (status "Exited (0)" is success).
  kafka-init:
    image: apache/kafka:4.1.1
    container_name: banking-kafka-init
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- Phase 14: observability
  # Prometheus scrapes the services' /actuator/prometheus (services on the host until Phase 15).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: banking-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop has it built in; Linux needs this line
    restart: unless-stopped

  # Jaeger receives traces over OTLP (4318 HTTP, 4317 gRPC) and shows them on :16686.
  # In-memory storage: traces are gone after a restart (production: Elasticsearch/Cassandra or Tempo).
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: banking-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (Spring Boot's default exporter)
    restart: unless-stopped

  # Grafana: dashboards over Prometheus and Jaeger, provisioned from infrastructure/monitoring/grafana.
  grafana:
    image: grafana/grafana:12.1.0
    container_name: banking-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    restart: unless-stopped

  # ---------------------------------------------------------------- Phase 15: the application
  # Only the gateway (8080) and the frontend (4200) are published. The services are reachable
  # only inside the Compose network: the gateway really is the single entry point now.
  user-service:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: user-service, PORT: "8081" } }
    image: banking/user-service:${IMAGE_TAG:-local}
    container_name: banking-user-service
    environment: *java-env
    secrets: [{ source: user_db_password, target: USER_DB_PASSWORD }]
    depends_on: *depends-on-data

  account-service:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: account-service, PORT: "8082" } }
    image: banking/account-service:${IMAGE_TAG:-local}
    container_name: banking-account-service
    environment: *java-env
    secrets: [{ source: account_db_password, target: ACCOUNT_DB_PASSWORD }]
    depends_on: *depends-on-data

  payment-service:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: payment-service, PORT: "8083" } }
    image: banking/payment-service:${IMAGE_TAG:-local}
    container_name: banking-payment-service
    environment:
      <<: *java-env
      ACCOUNT_SERVICE_URL: http://account-service:8082
      KEYCLOAK_TOKEN_URI: http://keycloak:8180/realms/banking/protocol/openid-connect/token
    secrets:
      - { source: payment_db_password, target: PAYMENT_DB_PASSWORD }
      - { source: payment_service_client_secret, target: PAYMENT_SERVICE_CLIENT_SECRET }
    depends_on: *depends-on-data

  transaction-service:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: transaction-service, PORT: "8084" } }
    image: banking/transaction-service:${IMAGE_TAG:-local}
    container_name: banking-transaction-service
    environment: *java-env
    secrets: [{ source: transaction_db_password, target: TRANSACTION_DB_PASSWORD }]
    depends_on: *depends-on-data

  notification-service:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: notification-service, PORT: "8085" } }
    image: banking/notification-service:${IMAGE_TAG:-local}
    container_name: banking-notification-service
    environment: *java-env
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    <<: *java-service
    build: { <<: *java-build, args: { SERVICE: api-gateway, PORT: "8080" } }
    image: banking/api-gateway:${IMAGE_TAG:-local}
    container_name: banking-api-gateway
    environment:
      <<: *java-env
      USER_SERVICE_URL: http://user-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - "8080:8080"

  frontend:
    build: { context: ./frontend }
    image: banking/frontend:${IMAGE_TAG:-local}
    container_name: banking-frontend
    profiles: [app]
    mem_limit: 64m
    ports:
      - "4200:8080"          # http://localhost:4200, the redirect URI registered in Keycloak
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- Phase 15: logs
  # Loki stores log lines, indexed only by a few labels (service, level); Grafana queries it.
  loki:
    image: grafana/loki:3.5.3
    container_name: banking-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]   # single-process, filesystem storage (dev)
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  # Alloy tails the logs of containers labelled banking.logs=true and pushes them to Loki.
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: banking-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to the Docker API, to discover containers and read their logs. Still
      # powerful (it can see every container): only for this collector, never for an app container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

# Phase 15: secrets become FILES in /run/secrets inside the container (target = file name), read
# by Spring's configtree. Unlike environment variables they don't show in `docker inspect`, in
# /proc/<pid>/environ, or in crash dumps. Values come from .env (never committed).
secrets:
  user_db_password:
    environment: USER_DB_PASSWORD
  account_db_password:
    environment: ACCOUNT_DB_PASSWORD
  payment_db_password:
    environment: PAYMENT_DB_PASSWORD
  transaction_db_password:
    environment: TRANSACTION_DB_PASSWORD
  payment_service_client_secret:
    environment: PAYMENT_SERVICE_CLIENT_SECRET

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  loki-data:
