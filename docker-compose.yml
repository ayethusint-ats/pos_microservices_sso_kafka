# Local infrastructure for the Banking Platform.
# It grows one phase at a time: Postgres (Phase 3), Keycloak (Phase 4), Kafka (Phase 11), and so on.
#
#   docker compose up -d        start
#   docker compose ps           status and health
#   docker compose down         stop (data is kept in the named volume)
#   docker compose down -v      stop AND delete data (re-runs the init scripts next time)
#
# Values like ${POSTGRES_ADMIN_PASSWORD} come from the .env file next to this file.
# ${VAR:?message} makes Compose refuse to start if the variable is missing.

name: banking-platform

services:
  postgres:
    image: postgres:17.12-alpine          # pin an exact version so every machine runs the same one
    container_name: banking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by infrastructure/postgres/init/01-create-service-databases.sh
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?set TRANSACTION_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      # host:container. The host port is 5433 by default so it doesn't clash with a locally
      # installed PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity Provider: login, tokens, users, roles. Our services never see a password.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: banking-keycloak
    # start-dev: HTTP allowed, theme caching off. For learning only; production uses `start`
    # with TLS and an optimized build.
    # --import-realm: imports every *.json in /opt/keycloak/data/import at startup,
    # but SKIPS a realm that already exists (so edits to the JSON need a re-import, see docs).
    command: ["start-dev", "--import-realm"]
    environment:
      # One-time admin for the master realm (admin console).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Keycloak stores its data in its own Postgres database (not the dev H2 file).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db   # "postgres" = Compose service name (Docker DNS)
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      # Same port inside and outside the container keeps URLs identical everywhere.
      KC_HTTP_PORT: 8180
      # Fixed public URL: tokens always carry iss=http://localhost:8180/realms/banking,
      # no matter which network address a request came in on.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"         # /health/ready on the management port 9000
      # Read by ${...} placeholders in the realm JSON, so no secret is stored in git.
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:?set PAYMENT_SERVICE_CLIENT_SECRET in .env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
    ports:
      - "8180:8180"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy   # wait for the DB healthcheck, not just container start
    healthcheck:
      # The image has no curl, so use bash's built-in /dev/tcp to call the readiness endpoint.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Event streaming (Phase 11). Single broker in KRaft mode: the broker is its own controller,
  # no ZooKeeper. Two listeners because clients connect from two "places":
  #   localhost:9092   services started on your machine (mvn spring-boot:run)
  #   kafka:29092      containers on the Compose network (kafka-init now, all services in Phase 15)
  # A client connects to the bootstrap address, then reconnects to the ADVERTISED address the broker
  # returns, so each listener must advertise an address that works from where its clients are.
  kafka:
    image: apache/kafka:4.1.1
    container_name: banking-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker → internal topics can't have 3 replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by infrastructure/kafka/create-topics.sh.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image's default is /tmp/kraft-combined-logs, which is NOT the volume below:
      # topics and messages would vanish whenever the container is re-created.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: creates the topics, then exits (status "Exited (0)" is success).
  kafka-init:
    image: apache/kafka:4.1.1
    container_name: banking-kafka-init
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- Phase 14: observability
  # Prometheus scrapes the services' /actuator/prometheus (services on the host until Phase 15).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: banking-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop has it built in; Linux needs this line
    restart: unless-stopped

  # Jaeger receives traces over OTLP (4318 HTTP, 4317 gRPC) and shows them on :16686.
  # In-memory storage: traces are gone after a restart (production: Elasticsearch/Cassandra or Tempo).
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: banking-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (Spring Boot's default exporter)
    restart: unless-stopped

  # Grafana: dashboards over Prometheus and Jaeger, provisioned from infrastructure/monitoring/grafana.
  grafana:
    image: grafana/grafana:12.1.0
    container_name: banking-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
