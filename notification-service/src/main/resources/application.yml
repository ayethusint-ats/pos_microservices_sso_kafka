server:
  port: 8085

spring:
  application:
    name: notification-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Phase 11: Kafka CONSUMER (no database: notifications are simulated and kept in memory).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Group IDs are set per listener (notification-service, notification-service-directory).
      # A brand-new group starts at the LATEST offset: don't e-mail customers about last month's
      # payments when this service is deployed for the first time.
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:   # only for the dead-letter topics
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000

banking:
  kafka:
    topics:
      payment-events: banking.payment-events
      account-transactions: banking.account-transactions
      customer-events: banking.customer-events
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

---
# Phase 14: observability. Metrics → Prometheus (/actuator/prometheus), traces → OpenTelemetry
# (OTLP) → Jaeger, and every log line carries the trace ID.
spring:
  kafka:
    template:
      observation-enabled: true    # a span per sent record, and the W3C traceparent header on it
    listener:
      observation-enabled: true    # the consumer continues the producer's trace
management:
  observations:
    enable:
      # Found live: Spring Security adds ~6 spans per request per service (filter chain, authentication,
      # authorization), about 60 % of a transfer's trace, hiding the calls that matter. Off for traces
      # AND their metrics; authentication failures still show up as 401s in http.server.requests.
      spring.security: false
  metrics:
    tags:
      application: ${spring.application.name}   # one label to tell the services apart in Prometheus
    distribution:
      percentiles-histogram:
        http.server.requests: true   # histogram buckets, so Prometheus can compute p95/p99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 100 % locally; e.g. 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

---
# JSON log lines (Elastic Common Schema) for log collectors: SPRING_PROFILES_ACTIVE=json-logs.
# Without the profile, logs stay human-readable (with [traceId-spanId] after the level).
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
