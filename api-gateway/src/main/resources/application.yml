server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:   # Spring Cloud 2025.0 prefix (the old "spring.cloud.gateway.*" names are deprecated)

          # How the gateway talks to services. Without timeouts, one hung service would tie up
          # gateway connections until clients give up.
          httpclient:
            connect-timeout: 2000      # ms to open a TCP connection. Failure → 502 Bad Gateway
            response-timeout: 5s       # max wait for the response. Failure → 504 Gateway Timeout

          # Applied to every route below.
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userOrIpKeyResolver}"     # who is being limited
                rate-limiter: "#{@inMemoryRateLimiter}"     # how (token bucket)

          # Routing table: first matching predicate wins. Paths are forwarded unchanged.
          # URIs are plain host names: service discovery is DNS (localhost now,
          # Docker service names in Phase 15, Kubernetes Services in Phase 16).
          routes:
            # Each service owns its public (self-service) AND its back-office paths.
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/customers/**,/api/admin/customers/**,/api/whoami
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/accounts/**,/api/admin/accounts/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/payments/**,/api/admin/payments/**
              # A transfer is several calls deep (payment → account-service × 4, with retries since
              # Phase 12), so it gets a longer budget than the global 5 s. Must exceed payment-service's
              # own worst case (≈ 15.6 s, see payment-service application.yml).
              metadata:
                response-timeout: 20000   # ms
            # Phase 11: read models fed by Kafka. They answer from their own data, so they keep
            # working while the services that produce the events are down.
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/transactions/**,/api/admin/transactions/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**

banking:
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api
  gateway:
    cors:
      # Only these browser origins may call the API from JavaScript.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      replenish-rate: 10     # tokens added per second, per user (sustained rate)
      burst-capacity: 20     # bucket size: short bursts above the sustained rate

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus    # /actuator/gateway/routes shows the live routing table
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
    gateway:
      access: read-only

---
# Phase 14: observability. Metrics → Prometheus (/actuator/prometheus), traces → OpenTelemetry
# (OTLP) → Jaeger, and every log line carries the trace ID.
management:
  observations:
    enable:
      # Found live: Spring Security adds ~6 spans per request per service (filter chain, authentication,
      # authorization), about 60 % of a transfer's trace, hiding the calls that matter. Off for traces
      # AND their metrics; authentication failures still show up as 401s in http.server.requests.
      spring.security: false
  metrics:
    tags:
      application: ${spring.application.name}   # one label to tell the services apart in Prometheus
    distribution:
      percentiles-histogram:
        http.server.requests: true   # histogram buckets, so Prometheus can compute p95/p99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 100 % locally; e.g. 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

---
# JSON log lines (Elastic Common Schema) for log collectors: SPRING_PROFILES_ACTIVE=json-logs.
# Without the profile, logs stay human-readable (with [traceId-spanId] after the level).
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs

---
# Phase 15: running in containers.
management:
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness: Docker healthcheck now, Kubernetes probes in Phase 16
server:
  shutdown: graceful             # on SIGTERM (docker stop): stop accepting, finish in-flight requests
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s   # then stop anyway; below Compose's stop_grace_period (30 s)

---
# Phase 16: on Kubernetes. Spring Boot detects it (every pod gets KUBERNETES_SERVICE_HOST) and
# activates this document by itself: no profile to remember, and nothing changes outside Kubernetes.
spring:
  config:
    activate:
      on-cloud-platform: kubernetes
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              # Pods come and go (rollouts, autoscaling). A pooled connection is pinned to ONE pod:
              # recycle connections so new replicas get traffic, and drop idle ones before the
              # service's server closes them (closing a connection just as it's reused → 502).
              max-idle-time: 15s
              max-life-time: 60s
management:
  server:
    # Actuator (metrics, health details) moves to its own port. A NetworkPolicy filters PORTS, not
    # URL paths: now it can let Prometheus reach 9000 and nothing else, and callers reach only the API port.
    port: 9000
  endpoint:
    health:
      probes:
        # /livez and /readyz ALSO on the main port: Kubernetes should probe the port that serves
        # traffic (a healthy management port says nothing about a stuck API connector).
        add-additional-paths: true
