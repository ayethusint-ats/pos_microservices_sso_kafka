# Phase 14: Prometheus PULLS metrics from every service's /actuator/prometheus every 15 s.
# Phase 15: the services run as containers on the same Compose network, addressed by service name.
# (Running one service from the IDE instead? Its target shows DOWN; point that one at
# host.docker.internal:<port>.) Kubernetes discovers pods instead (Phase 16).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: banking-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - user-service:8081
          - account-service:8082
          - payment-service:8083
          - transaction-service:8084
          - notification-service:8085

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
