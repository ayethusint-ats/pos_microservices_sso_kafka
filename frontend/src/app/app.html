<header class="topbar">
  <a class="brand" routerLink="/">Modern Bank</a>

  @if (auth.isAuthenticated()) {
    <!-- Menu items follow the roles as a convenience; the backend enforces every rule. -->
    <nav aria-label="Main">
      @if (auth.hasRole('CUSTOMER')) {
        <a routerLink="/accounts" routerLinkActive="active">Accounts</a>
        <a routerLink="/profile" routerLinkActive="active">Profile</a>
      }
      @if (auth.isStaff()) {
        <a routerLink="/backoffice" routerLinkActive="active">Back office</a>
      }
      <a routerLink="/token" routerLinkActive="active">Token</a>
    </nav>
  }

  <div class="session">
    @if (auth.isAuthenticated()) {
      <span class="user" data-testid="current-user">{{ auth.username() }}</span>
      @for (role of auth.roles(); track role) {
        <span class="chip">{{ role }}</span>
      }
      <button type="button" class="secondary" (click)="auth.logout()" data-testid="logout">Log out</button>
    } @else {
      <button type="button" (click)="auth.login()" data-testid="login">Log in</button>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>
