# Phase 15: serves the built Angular app. nginx-unprivileged runs as a non-root user and
# therefore listens on 8080 (ports < 1024 need root). Compose publishes it as localhost:4200,
# the redirect URI registered in Keycloak.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;                       # don't advertise the nginx version

    # Security headers on every response (including index.html).
    # CSP: scripts only from this origin (the build has no inline script, see angular.json);
    # XHR only to the gateway and Keycloak. 'unsafe-inline' for styles: Angular injects component
    # styles at runtime (a nonce via ngCspNonce would remove it).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8180; frame-src http://localhost:8180; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed file names (main-ESURD5K4.js) never change content: cache for a year.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: any other path (/payments, /backoffice) is a client-side route → index.html.
    # index.html itself must never be cached, or users keep running an old release.
    location / {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8180; frame-src http://localhost:8180; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8180" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
