server:
  port: 8081

spring:
  application:
    name: user-service

  # Local-dev convenience: read secrets from the git-ignored .env file in the project root.
  # "optional:" means no error if it's missing. In Docker/Kubernetes (Phases 15-16) the same
  # names come from real environment variables instead.
  # Two paths: `mvn -pl user-service spring-boot:run` runs in the module folder (../.env);
  # `java -jar` from the project root uses .env.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # This service connects ONLY to its own database with its own role.
  # It can't read account_db: the role has no CONNECT privilege there.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5433}}/user_db
    username: ${USER_DB_USERNAME:user_svc}
    password: ${USER_DB_PASSWORD}          # no default: a secret must never live in the code
    hikari:
      # Connections per instance. Total across all services and replicas must stay below
      # Postgres max_connections (default 100).
      maximum-pool-size: 10
      pool-name: user-service-pool

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only CHECKS at startup that the tables match
      # the entities, and refuses to start if they don't.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # store and read timestamps in UTC regardless of the server's zone

  # Phase 11: Kafka producer (same settings as account-service; see its application.yml).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

  flyway:
    # Runs pending scripts from src/main/resources/db/migration at startup, before JPA.
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

# Phase 5: this service is an OAuth2 Resource Server and trusts tokens from the Keycloak "banking" realm.
banking:
  kafka:
    topics:
      customer-events: banking.customer-events
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}
      audience: banking-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Anyone (probes) sees {"status":"UP"}; component details only for ROLE_ADMIN tokens.
      show-details: when-authorized
      roles: ADMIN

---
# Phase 14: observability. Metrics → Prometheus (/actuator/prometheus), traces → OpenTelemetry
# (OTLP) → Jaeger, and every log line carries the trace ID.
spring:
  kafka:
    template:
      observation-enabled: true    # a span per sent record, and the W3C traceparent header on it
    listener:
      observation-enabled: true    # the consumer continues the producer's trace
management:
  observations:
    enable:
      # Found live: Spring Security adds ~6 spans per request per service (filter chain, authentication,
      # authorization), about 60 % of a transfer's trace, hiding the calls that matter. Off for traces
      # AND their metrics; authentication failures still show up as 401s in http.server.requests.
      spring.security: false
  metrics:
    tags:
      application: ${spring.application.name}   # one label to tell the services apart in Prometheus
    distribution:
      percentiles-histogram:
        http.server.requests: true   # histogram buckets, so Prometheus can compute p95/p99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # 100 % locally; e.g. 0.1 in production
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

---
# JSON log lines (Elastic Common Schema) for log collectors: SPRING_PROFILES_ACTIVE=json-logs.
# Without the profile, logs stay human-readable (with [traceId-spanId] after the level).
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
